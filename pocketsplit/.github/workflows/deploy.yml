name: PocketSplit CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Client Dependencies
      run: cd client && npm install

    - name: Run Build (Frontend)
      run: npm run build

    - name: Build Docker Image
      run: docker build -t pocketsplit:latest .

    - name: Verify Docker Build Success
      run: |
        docker images | grep pocketsplit
